# Release pipeline: tag `vX.Y.Z` → multi-platform Go binaries (SPA embedded) +
# SHA256SUMS GitHub Release + npm publish of the `kiroproxy` launcher.
#
# Required secrets:
#   NPM_TOKEN  — npm automation token with publish rights for `kiroproxy`
#
# The launcher (cli/) downloads the matching binary from this release on
# `npm i -g kiroproxy` and verifies it against SHA256SUMS before executing it.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.5). Leave empty to use the pushed tag.'
        required: false
        type: string

permissions:
  contents: write

env:
  GO_VERSION: '1.23.x'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------- frontend --
  frontend:
    name: Build admin SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pin minor: floating "9" has pulled broken corepack-backed installs.
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install & build
        working-directory: web/frontend
        run: |
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm build
          test -f ../dist/index.html

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------- binaries --
  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: kiro-go-linux-amd64
          - goos: linux
            goarch: arm64
            asset: kiro-go-linux-arm64
          - goos: darwin
            goarch: amd64
            asset: kiro-go-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: kiro-go-darwin-arm64
          - goos: windows
            goarch: amd64
            asset: kiro-go-windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset: kiro-go-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download SPA
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # //go:embed all:dist fails the build if index.html is missing; fail fast
      # rather than shipping a binary that falls back to the placeholder.
      - name: Verify SPA present
        run: test -f web/dist/index.html && ! grep -q 'data-kiroproxy-placeholder' web/dist/index.html

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.asset }}" .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 7
          if-no-files-found: error

  # ----------------------------------------------------------------- release --
  release:
    name: GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Strip leading v for the npm/semver form.
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $VERSION)"

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: release
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: release
        run: |
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kiro Proxy ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------- npm publish
  npm:
    name: Publish kiroproxy to npm
    needs: release
    runs-on: ubuntu-latest
    # id-token not required: we publish with --provenance=false so a plain
    # NPM_TOKEN automation/granular token is enough.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          # Always write an .npmrc that points at NODE_AUTH_TOKEN.
          always-auth: true

      - name: Sync version from tag
        working-directory: cli
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('package.json version →', pkg.version);
          "
        env:
          VERSION: ${{ needs.release.outputs.version }}

      # secrets cannot be referenced in job-level `if`, so skip inside the step
      # when the token is unset (forks / dry runs without NPM_TOKEN configured).
      - name: Publish
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret is empty — skipping npm publish"
            exit 0
          fi
          # Diagnostics that never print the secret itself.
          echo "token length: ${#NODE_AUTH_TOKEN}"
          echo "token prefix: ${NODE_AUTH_TOKEN:0:7}…"
          if [ ! -f "$HOME/.npmrc" ] && [ ! -f .npmrc ]; then
            echo "registry=https://registry.npmjs.org/" > .npmrc
            echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc
            echo "always-auth=true" >> .npmrc
            echo "wrote local .npmrc (auth via env expansion)"
          fi
          echo "npm whoami:"
          if ! npm whoami; then
            echo "::error::npm whoami failed. Recreate the GitHub secret NPM_TOKEN from an npm token with:"
            echo "  - Packages: Read and write"
            echo "  - Organizations: No access"
            echo "  - Bypass 2FA: enabled"
            echo "  - Classic 'Automation' or Granular with publish rights"
            exit 1
          fi
          npm publish --access public --provenance=false --verbose
