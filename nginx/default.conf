upstream kiro_go {
    server kiro-go:8080;
}

server {
    listen 80;
    server_name api.botlease.click;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.botlease.click;

    ssl_certificate /etc/letsencrypt/live/api.botlease.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.botlease.click/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://kiro_go;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
