services:
  kiro-go:
    build: .
    expose:
      - "8080"
    ports:
      - "127.0.0.1:3128:3128"
      - "127.0.0.1:3129:3129"
      - "127.0.0.1:56121:56121"
    volumes:
      - ./data:/app/data
    environment:
      - CONFIG_PATH=/app/data/config.json
      - KIRO_SSO_CALLBACK_BIND=0.0.0.0
      - ANTIGRAVITY_CALLBACK_BIND=0.0.0.0
      - XAI_CALLBACK_BIND=0.0.0.0
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    restart: unless-stopped

  nginx:
    build: ./nginx
    depends_on:
      - kiro-go
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
